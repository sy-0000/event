<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>創意作品上傳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mat: #DCE4DA;      /* 切割墊綠灰 */
    --grid: #C7D2C4;
    --ink: #1E2B2F;
    --muted: #56676A;
    --paper: #FFFFFF;
    --safety: #F3C623;   /* 安全黃：唯一的強調色 */
    --error: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 400 16px/1.7 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 30px; font-weight: 900; line-height: 1.25; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .sheet { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 20px; }
  .notice { font-size: 14px; color: var(--muted); border-left: 4px solid var(--safety); padding: 2px 0 2px 12px; margin-bottom: 20px; }
  .notice strong { color: var(--ink); }
  label.field { display: block; font-weight: 500; margin: 16px 0 6px; }
  input[type=text], input[type=email] {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    border: 1.5px solid var(--muted); border-radius: 4px; background: #fff;
  }
  input:focus-visible, button:focus-visible, .drop:focus-within { outline: 3px solid var(--safety); outline-offset: 2px; }
  .drop {
    display: block; margin-top: 16px; padding: 22px 16px; text-align: center; cursor: pointer;
    border: 2px dashed var(--ink); border-radius: 6px; background: #FAFBF8;
  }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop .big { font-weight: 700; font-size: 18px; display: block; }
  .drop .small { font-size: 14px; color: var(--muted); }
  #preview { max-width: 100%; max-height: 220px; margin-top: 12px; border-radius: 4px; display: none; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 15px; }
  .check input { width: 20px; height: 20px; margin-top: 4px; flex: none; accent-color: var(--ink); }
  #emailWrap { display: none; }
  button {
    width: 100%; margin-top: 24px; padding: 14px; font: 700 18px/1 inherit; font-family: inherit;
    color: var(--ink); background: var(--safety); border: 2px solid var(--ink); border-radius: 6px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: wait; }
  #status { margin-top: 14px; min-height: 1.7em; font-weight: 500; }
  #status.err { color: var(--error); }
  .done { text-align: center; padding: 12px 0; }
  .done .big { font-size: 22px; font-weight: 900; display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>上傳你的創意作品</h1>
  <p class="lead">上傳後，AI 會依生活科技評量標準給你回饋。</p>

  <div class="sheet" id="formSheet">
    <div class="notice">
      <strong>資料使用說明：</strong>你上傳的檔案與填寫的資料僅供本次活動體驗使用，檔案會交給 Gemini 進行分析，<strong>活動結束後將全數刪除</strong>。
    </div>

    <label class="field" for="workName">作品名稱</label>
    <input type="text" id="workName" maxlength="40" placeholder="例如：可調式手機架">

    <label class="field" for="nickname">暱稱</label>
    <input type="text" id="nickname" maxlength="40">

    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/jpeg,image/png,application/pdf">
      <span class="big" id="dropText">選擇檔案</span>
      <span class="small">JPG、PNG 或 PDF，10MB 以內</span>
      <img id="preview" alt="作品預覽">
    </label>

    <div class="check">
      <input type="checkbox" id="wantMail">
      <label for="wantMail">我想用 Email 收到評語（老師確認後才會寄出）</label>
    </div>
    <div id="emailWrap">
      <label class="field" for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>

    <div class="check">
      <input type="checkbox" id="agree">
      <label for="agree">我已閱讀並同意上方資料使用說明</label>
    </div>

    <button id="submit">上傳作品</button>
    <div id="status" role="status"></div>
  </div>
</main>

<script>
  // ★ 貼上 GAS 部署的網址（/exec 結尾）
  const API_URL = '請貼上GAS網址';
  // 活動代碼從 QR code 網址的 ?code= 讀取，不寫在程式裡
  const CODE = new URLSearchParams(location.search).get('code') || '';

  const MAX = 10 * 1024 * 1024;
  const OK_TYPES = ['image/jpeg', 'image/png', 'application/pdf'];
  const $ = id => document.getElementById(id);

  $('wantMail').addEventListener('change', e => {
    $('emailWrap').style.display = e.target.checked ? 'block' : 'none';
  });

  $('file').addEventListener('change', () => {
    const f = $('file').files[0];
    const img = $('preview');
    if (!f) return;
    $('dropText').textContent = f.name;
    if (f.type.startsWith('image/')) { img.src = URL.createObjectURL(f); img.style.display = 'block'; }
    else img.style.display = 'none';
  });

  if (!CODE) {
    document.getElementById('formSheet').innerHTML =
      '<div class="done"><span class="big">請掃描現場的 QR code</span>直接開啟這個網址無法上傳作品。</div>';
  }

  function say(msg, isErr) {
    $('status').textContent = msg;
    $('status').className = isErr ? 'err' : '';
  }

  if (CODE) $('submit').addEventListener('click', () => {
    const f = $('file').files[0];
    if (!$('workName').value.trim() || !$('nickname').value.trim()) return say('請填寫作品名稱與暱稱。', true);
    if (!f) return say('請選擇要上傳的檔案。', true);
    if (!OK_TYPES.includes(f.type)) return say('只接受 JPG、PNG 或 PDF 檔案。', true);
    if (f.size > MAX) return say('檔案超過 10MB，請壓縮後再上傳。', true);
    if ($('wantMail').checked && !$('email').value.trim()) return say('勾選收信請填寫 Email。', true);
    if (!$('agree').checked) return say('請勾選同意資料使用說明。', true);

    $('submit').disabled = true;
    say('上傳中…');

    const reader = new FileReader();
    reader.onload = () => {
      fetch(API_URL, {
        method: 'POST',
        // text/plain 可以避免跨網域預檢，GAS 才收得到
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          code: CODE,
          workName: $('workName').value,
          nickname: $('nickname').value,
          wantMail: $('wantMail').checked,
          email: $('email').value,
          agree: $('agree').checked,
          mimeType: f.type,
          data: reader.result.split(',')[1]
        })
      })
        .then(r => r.json())
        .then(res => {
          if (!res.ok) throw new Error(res.message);
          $('formSheet').innerHTML =
            '<div class="done"><span class="big">已上傳</span>等大家都上傳完，我們一起看 AI 的評量結果。</div>';
        })
        .catch(err => {
          $('submit').disabled = false;
          say(err.message || '上傳失敗，請再試一次。', true);
        });
    };
    reader.onerror = () => { $('submit').disabled = false; say('讀取檔案失敗，請重新選擇。', true); };
    reader.readAsDataURL(f);
  });
</script>
</body>
</html>
